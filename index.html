<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Catch My Heart ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Catch My Heart ❤️</h1>

    <p>Catch 10 hearts to unlock a surprise 💕</p>

    <h3>
        Hearts: <span id="score">0</span> / 10
    </h3>

    <div id="game">

        <div id="player">🧺</div>

    </div>

    <div class="buttons">

        <button onclick="moveLeft()">⬅️</button>

        <button onclick="moveRight()">➡️</button>

    </div>

    <div id="questionBox">

        <h2 id="question"></h2>

        <div id="answers"></div>

    </div>

    <div id="finalBox">

        <h1>You Won! ❤️</h1>

        <p>You caught all my hearts 🥹</p>

        <h2>
            But you already have my heart ❤️
        </h2>

    </div>

    <script src="script.js"></script>

</body>

</html>
