<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Unfinished Story ❤️</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#fff7fa;
    color:#4b2635;
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
}

/* MUSIC */

audio{
    display:none;
}

/* FLOATING HEARTS */

.hearts{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

.heart{
    position:absolute;
    bottom:-50px;
    font-size:20px;
    opacity:.45;
    animation:floatHeart linear infinite;
}

.heart:nth-child(1){left:8%;animation-duration:10s;}
.heart:nth-child(2){left:20%;animation-duration:14s;animation-delay:2s;}
.heart:nth-child(3){left:35%;animation-duration:11s;animation-delay:4s;}
.heart:nth-child(4){left:52%;animation-duration:15s;animation-delay:1s;}
.heart:nth-child(5){left:68%;animation-duration:12s;animation-delay:3s;}
.heart:nth-child(6){left:82%;animation-duration:16s;animation-delay:5s;}
.heart:nth-child(7){left:92%;animation-duration:13s;animation-delay:2s;}

@keyframes floatHeart{

    0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }

    15%{
        opacity:.5;
    }

    80%{
        opacity:.4;
    }

    100%{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}

/* HERO */

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px 20px;
    position:relative;
    z-index:1;
    background:
        radial-gradient(circle at top left,#ffe0ea,transparent 40%),
        radial-gradient(circle at bottom right,#f9d5e1,transparent 40%),
        #fff7fa;
}

.hero-content{
    max-width:800px;
    animation:heroAppear 2s ease;
}

.small-title{
    font-size:14px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:#a35b76;
    margin-bottom:20px;
}

.hero h1{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(55px,12vw,110px);
    line-height:.9;
    color:#8f3659;
    margin-bottom:25px;
}

.hero h2{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(25px,5vw,42px);
    font-weight:500;
    color:#57313f;
    margin-bottom:25px;
}

.hero p{
    max-width:600px;
    margin:auto;
    line-height:1.9;
    color:#795465;
    font-size:15px;
}

.start-btn{
    display:inline-block;
    margin-top:35px;
    padding:14px 30px;
    border-radius:50px;
    background:#9e4565;
    color:white;
    text-decoration:none;
    box-shadow:0 10px 30px rgba(158,69,101,.25);
    transition:.3s;
}

.start-btn:hover{
    transform:translateY(-4px);
    box-shadow:0 15px 35px rgba(158,69,101,.35);
}

.scroll-text{
    margin-top:50px;
    font-size:12px;
    letter-spacing:2px;
    color:#a77b89;
    animation:bounce 2s infinite;
}

@keyframes bounce{

    0%,100%{transform:translateY(0);}
    50%{transform:translateY(8px);}

}

@keyframes heroAppear{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* STORY */

.story{
    position:relative;
    z-index:1;
    padding:100px 20px;
    max-width:1000px;
    margin:auto;
}

.section-heading{
    text-align:center;
    margin-bottom:70px;
}

.section-heading span{
    font-size:12px;
    letter-spacing:4px;
    color:#a35b76;
    text-transform:uppercase;
}

.section-heading h2{
    font-family:'Cormorant Garamond',serif;
    font-size:55px;
    color:#843b58;
    margin-top:10px;
}

/* TIMELINE */

.timeline{
    position:relative;
}

.timeline::before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:2px;
    background:#edc8d3;
    transform:translateX(-50%);
}

.story-card{
    width:45%;
    background:rgba(255,255,255,.8);
    border:1px solid #f1d9e1;
    border-radius:25px;
    padding:30px;
    margin-bottom:70px;
    box-shadow:0 15px 45px rgba(120,55,80,.08);
    position:relative;
    opacity:0;
    transform:translateY(50px);
    transition:1s ease;
}

.story-card.show{
    opacity:1;
    transform:translateY(0);
}

.story-card:nth-child(odd){
    margin-right:auto;
}

.story-card:nth-child(even){
    margin-left:auto;
}

.story-card::after{
    content:"❤️";
    position:absolute;
    top:30px;
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    border:2px solid #edc8d3;
    border-radius:50%;
    font-size:17px;
}

.story-card:nth-child(odd)::after{
    right:-75px;
}

.story-card:nth-child(even)::after{
    left:-75px;
}

.date{
    color:#a84f70;
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:12px;
}

.story-card h3{
    font-family:'Cormorant Garamond',serif;
    font-size:34px;
    color:#74354f;
    margin-bottom:15px;
}

.story-card p{
    font-size:14px;
    line-height:1.95;
    color:#705563;
}

.reaction{
    margin-top:20px;
    font-size:25px;
}

/* SPECIAL QUOTE */

.quote{
    margin:100px auto;
    max-width:800px;
    text-align:center;
    padding:60px 30px;
    background:linear-gradient(135deg,#fff,#fff0f5);
    border-radius:35px;
    box-shadow:0 20px 60px rgba(130,50,80,.1);
    position:relative;
    z-index:1;
}

.quote .symbol{
    font-size:35px;
    margin-bottom:20px;
}

.quote p{
    font-family:'Cormorant Garamond',serif;
    font-size:35px;
    line-height:1.4;
    color:#7e3855;
}

.quote small{
    display:block;
    margin-top:20px;
    color:#a47787;
}

/* QUESTIONS */

.questions{
    max-width:850px;
    margin:100px auto;
    padding:20px;
    position:relative;
    z-index:1;
}

.question-box{
    background:white;
    padding:30px;
    margin-bottom:25px;
    border-radius:22px;
    box-shadow:0 10px 35px rgba(100,40,65,.08);
    border:1px solid #f1dce3;
}

.question-box label{
    display:block;
    font-family:'Cormorant Garamond',serif;
    font-size:25px;
    color:#783851;
    margin-bottom:15px;
}

textarea{
    width:100%;
    min-height:100px;
    border:1px solid #ebcbd6;
    border-radius:15px;
    padding:15px;
    resize:vertical;
    outline:none;
    font-family:'Poppins',sans-serif;
    color:#593342;
    background:#fffafb;
}

textarea:focus{
    border-color:#b45b79;
    box-shadow:0 0 0 3px rgba(180,91,121,.1);
}

.submit-btn{
    width:100%;
    padding:17px;
    border:0;
    border-radius:50px;
    background:#923e60;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.submit-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(146,62,96,.3);
}

#status{
    text-align:center;
    margin-top:20px;
    color:#8f4562;
    font-weight:500;
}

/* LETTER */

.letter-section{
    max-width:800px;
    margin:100px auto;
    padding:20px;
    position:relative;
    z-index:1;
}

.letter{
    background:#fff;
    padding:50px 35px;
    border-radius:25px;
    box-shadow:0 15px 50px rgba(100,40,65,.1);
    border:1px solid #f1dce3;
}

.letter h2{
    text-align:center;
    font-family:'Cormorant Garamond',serif;
    font-size:45px;
    color:#843b58;
    margin-bottom:30px;
}

.letter p{
    text-align:center;
    color:#765563;
    line-height:1.9;
    margin-bottom:25px;
}

/* END */

.end{
    min-height:80vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:50px 25px;
    position:relative;
    z-index:1;
    background:linear-gradient(180deg,#fff7fa,#ffe8f0);
}

.end-content{
    max-width:700px;
}

.end .heart-big{
    font-size:70px;
    animation:heartbeat 1.5s infinite;
}

.end h2{
    font-family:'Cormorant Garamond',serif;
    font-size:65px;
    color:#813650;
    margin:20px 0;
}

.end p{
    line-height:2;
    color:#735362;
}

.final-line{
    margin-top:35px;
    font-family:'Cormorant Garamond',serif;
    font-size:28px;
    color:#913f60;
}

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.18);
    }

}

/* MOBILE */

@media(max-width:700px){

    .hero h1{
        font-size:65
